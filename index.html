<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDKS Saha Terminali</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h3 { color: #333; }
        .status { padding: 12px; margin: 15px 0; border-radius: 8px; font-weight: bold; font-size: 14px; background: #fff3cd; color: #856404; }
        .btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .btn-green { background: #28a745; }
        .log { text-align: left; background: #1e1e1e; color: #00ff00; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 11px; height: 150px; overflow-y: auto; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h3>PDKS Saha Terminali</h3>
    
    <div id="statusBox" class="status">Sistem Hazır</div>

    <!-- Adım 1: GPS Al ve Kilitle -->
    <button class="btn" onclick="getLiveLocation()">1. Konum Al ve Kilitle</button>

    <!-- Adım 2: NFC Oku -->
    <button class="btn btn-green" id="nfcBtn" onclick="startNfcScan()" disabled style="opacity: 0.5;">2. NFC Kart Okut</button>

    <div class="log" id="logBox">
        > Terminal başlatıldı. Lütfen önce konum alın.<br>
    </div>
</div>

<script>
    let verifiedGps = { lat: null, lng: null };

    function getLiveLocation() {
        updateStatus("GPS uyduları aranıyor...", "#fff3cd", "#856404");
        logMessage("Konum talebi gönderildi.");

        if (!navigator.geolocation) {
            updateStatus("Tarayıcı GPS desteklemiyor.", "#f8d7da", "#721c24");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                verifiedGps.lat = position.coords.latitude;
                verifiedGps.lng = position.coords.longitude;
                
                updateStatus(`Konum Başarılı (${verifiedGps.lat.toFixed(4)}, ${verifiedGps.lng.toFixed(4)})`, "#d4edda", "#155724");
                logMessage(`[GPS OK] ${verifiedGps.lat.toFixed(6)}, ${verifiedGps.lng.toFixed(6)}`);

                let nfcButton = document.getElementById('nfcBtn');
                nfcButton.disabled = false;
                nfcButton.style.opacity = "1";
                logMessage("Konum kilitlendi! Şimdi NFC kart okutabilirsiniz.");
            },
            (error) => {
                let errDesc = error.message;
                if(error.code === 1) errDesc = "Konum izni reddedildi.";
                else if(error.code === 2) errDesc = "GPS sinyali alınamadı.";
                else if(error.code === 3) errDesc = "Zaman aşımı.";

                updateStatus(`GPS Hatası: ${errDesc}`, "#f8d7da", "#721c24");
                logMessage(`Hata Kod ${error.code}: ${errDesc}`);
            },
            { 
                enableHighAccuracy: true, 
                timeout: 10000, 
                maximumAge: 0 
            }
        );
    }

    async function startNfcScan() {
        if (verifiedGps.lat === null) {
            alert("Önce konum almanız gerekiyor!");
            return;
        }

        if ('NDEFReader' in window) {
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                updateStatus("NFC Aktif! Kartı telefona dokundurun...", "#cce5ff", "#004085");
                logMessage("NFC dinlemede...");

                ndef.onreading = event => {
                    let serialNumber = event.serialNumber;
                    playBip();
                    
                    updateStatus(`KART OKUNDU! UID: ${serialNumber}`, "#d4edda", "#155724");
                    logMessage(`[OKUTULDU] Kart: ${serialNumber} | Konum: ${verifiedGps.lat.toFixed(6)}, ${verifiedGps.lng.toFixed(6)}`);
                };

                ndef.onreadingerror = () => {
                    logMessage("NFC okuma hatası, tekrar dokundurun.");
                };

            } catch (error) {
                updateStatus(`NFC Başlatılamadı: ${error}`, "#f8d7da", "#721c24");
                logMessage(`NFC Hata detayı: ${error}`);
            }
        } else {
            updateStatus("Web NFC bu tarayıcıda desteklenmiyor.", "#fff3cd", "#856404");
            logMessage("Web NFC API desteklenmiyor.");
        }
    }

    function updateStatus(text, bg, color) {
        let box = document.getElementById('statusBox');
        box.innerText = text;
        box.style.backgroundColor = bg;
        box.style.color = color;
    }

    function logMessage(text) {
        let box = document.getElementById('logBox');
        box.innerHTML += `> ${text}<br>`;
        box.scrollTop = box.scrollHeight;
    }

    function playBip() {
        try {
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 900;
            osc.start();
            setTimeout(() => { osc.stop(); }, 150);
        } catch(e) {}
    }
</script>

</body>
</html>
