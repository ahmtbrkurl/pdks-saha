<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDKS Saha Terminali - Profesyonel (Yetki ve Giriş Destekli)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h3 { color: #333; margin-top: 0; }
        
        #networkStatus { padding: 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 15px; background: #d4edda; color: #155724; }
        .offline { background: #f8d7da !important; color: #721c24 !important; }

        /* Giriş Paneli */
        .login-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: left; }
        .login-box input { width: 100%; padding: 10px; margin: 5px 0 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .login-box label { font-size: 11px; font-weight: bold; color: #495057; }

        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .mode-btn { padding: 12px; font-size: 14px; font-weight: bold; border: 2px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; color: #555; transition: 0.3s; }
        .mode-btn.active { border-color: #007bff; background: #cce5ff; color: #004085; }

        .status { padding: 12px; margin: 15px 0; border-radius: 8px; font-weight: bold; font-size: 14px; background: #fff3cd; color: #856404; }
        .action-btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .action-btn:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }
        .btn-green { background: #28a745; }
        
        /* Buton Başlangıçta Gizli (CSS ile gizle, JS ile aç) */
        .btn-orange { background: #fd7e14; display: none; }

        .personnel-box { display: none; margin-top: 15px; text-align: left; }
        .personnel-box select { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #ccc; font-size: 14px; margin-bottom: 10px; }
        
        .file-upload-box { margin-top: 10px; padding: 10px; background: #f8f9fa; border: 1px dashed #6c757d; border-radius: 8px; text-align: center; display: none; }
        .file-upload-box input { font-size: 12px; width: 100%; margin-top: 5px; }
        #uploadStatus { font-size: 11px; margin-top: 5px; color: #555; }

        .log { text-align: left; background: #1e1e1e; color: #00ff00; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 11px; height: 140px; overflow-y: auto; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div id="networkStatus">📡 Çevrimiçi (Online) - Güvenli Senkronizasyon</div>
    <h3>PDKS Saha Terminali</h3>

    <!-- Bireysel Giriş Paneli (Login) -->
    <div class="login-box" id="loginBox">
        <label>Kullanıcı Adı:</label>
        <input type="text" id="usernameInput" placeholder="Örn: ahmet">
        <label>Şifre:</label>
        <input type="password" id="passwordInput" placeholder="****">
        <button class="action-btn" style="padding: 10px; font-size: 13px;" onclick="doUserLogin()">Giriş Yap</button>
    </div>
    
    <div class="mode-grid">
        <!-- Başlangıçta hepsi disabled -->
        <button class="mode-btn" id="btn-GİRİŞ" onclick="setMode('GİRİŞ')" disabled>GİRİŞ (NFC)</button>
        <button class="mode-btn" id="btn-ÇIKIŞ" onclick="setMode('ÇIKIŞ')" disabled>ÇIKIŞ (NFC)</button>
        <button class="mode-btn" id="btn-İZİNLİ" onclick="setMode('İZİNLİ')" disabled>İZİNLİ</button>
        <button class="mode-btn" id="btn-RAPORLU" onclick="setMode('RAPORLU')" disabled>RAPORLU</button>
    </div>
    
    <div id="statusBox" class="status">Lütfen önce giriş yapın.</div>

    <button class="action-btn" id="gpsBtn" onclick="getLiveLocation()" disabled>1. Konum Al ve Kilitle</button>
    <button class="action-btn btn-green" id="nfcBtn" onclick="startNfcScan()" disabled>2. NFC Kart Okut</button>

    <div class="personnel-box" id="personnelBox">
        <!-- Formen Paneli (Dropdown gösterir) -->
        <div id="formenPanel" style="display: none; margin-bottom: 10px;">
            <label for="personSelect" style="font-size: 12px; font-weight: bold; color: #333;">Data Gireceğiniz Personeli Seçiniz:</label>
            <select id="personSelect"><option value="">-- Personel Seçin --</option></select>
        </div>
        <!-- User Paneli (Sadece bilgi mesajı) -->
        <div id="userPanel" style="display: none; font-size: 14px; font-weight: bold; background: #e9ecef; padding: 10px; border-radius: 6px; color: #333; margin-bottom: 10px;">
            Veriler sizin adınıza girilecektir.
        </div>
        
        <!-- Sıkıştırma Destekli Fotoğraf Yükleme -->
        <div class="file-upload-box" id="fileUploadBox">
            <label style="font-size: 11px; color: #d9534f; font-weight: bold;">⚠️ Belge Fotoğrafı Çekin:</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleFileSelect(this)">
            <div id="uploadStatus">Hazır.</div>
        </div>

        <button class="action-btn btn-orange" id="submitPersonBtn" onclick="submitPersonnelStatus()" disabled>Verileri ve Durumu Kaydet</button>
    </div>

    <div class="log" id="logBox">
        > Terminal başlatıldı. Lütfen giriş yapın.<br>
    </div>
</div>

<script>
    // --- GÜVENLİK AYARI: BURAYI GAS TARAFINDAKİ İLE EŞİTLEYİN ---
    const API_URL = "https://script.google.com/macros/s/AKfycby7xgRdGuzfWsPXTS3_9Zb3DUUqD7Dave_lyXVYeIVN0NXpHf_ufuqYuUnXRioMmcLd/exec";
    const AUTH_TOKEN = "PDKS-SECURE-AUTH-98f4b2c17e6a3d5f8b9e0a1c2d3e4f5a";
    // -----------------------------------------------------------
    
    let currentMode = null;
    let verifiedGps = { lat: null, lng: null };
    let loggedInUser = null; // Giriş yapan kullanıcının ID, Ad, Unvan bilgileri
    let globalPersonnelList = []; // Sadece Formen'ler için personel listesi
    let compressedBase64 = ""; // Sıkıştırılmış resmi tutacak değişken

    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);
    window.addEventListener('load', initializeApp);

    function initializeApp() {
        updateNetworkStatus();
        logMessage("[SİSTEM] Terminal hazır, lütfen giriş yapın.");
    }

    // --- Giriş (Login) Mantığı ---
    async function doUserLogin() {
        const uName = document.getElementById('usernameInput').value.trim();
        const uPass = document.getElementById('passwordInput').value.trim();

        if (!uName || !uPass) { alert("Kullanıcı adı ve şifre girin!"); return; }

        updateStatus(`Giriş yapılıyor...`, "#fff3cd", "#856404");
        document.querySelector('.login-box button').disabled = true;
        logMessage(`[GİRİŞ] Deneniyor: ${uName}...`);

        try {
            // Giriş denemesi POST ile GAS'a gönderilir
            let response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ token: AUTH_TOKEN, action: 'login', username: uName, password: uPass })
            });
            
            let textData = await response.text();
            let result = JSON.parse(textData);

            if (result.status === "success") {
                loggedInUser = result.user; // ID, ad, unvan (Formen/User)
                document.getElementById('loginBox').style.backgroundColor = '#d4edda';
                logMessage(`[BAŞARILI] Hoş geldiniz, ${loggedInUser.ad} (${loggedInUser.unvan}).`);
                updateStatus(`Giriş Başarılı, mod seçin.`, "#d4edda", "#155724");
                
                // --- KRİTİK: TÜM MOD BUTONLARINI AKTİF ET ---
                document.querySelectorAll('.mode-grid button').forEach(btn => btn.disabled = false);
                
                // Formen ise tüm listeyi indir, User ise indirme
                if (loggedInUser.unvan === 'Formen') {
                    await loadPersonnelListForFormen();
                }

            } else {
                alert("HATA: " + result.message);
                updateStatus("Giriş başarısız.", "#f8d7da", "#721c24");
                logMessage(`[REDDEDİLDİ] Giriş başarısız: ${result.message}`);
                document.querySelector('.login-box button').disabled = false;
            }
        } catch (error) {
            logMessage(`[HATA] Giriş işlemi başarısız: ${error}`);
            alert("Giriş işlemi sırasında hata oluştu. Bağlantıyı kontrol edin.");
            document.querySelector('.login-box button').disabled = false;
        }
    }

    // Sadece Formen'ler için personel listesini indirme mantığı
    async function loadPersonnelListForFormen() {
        if (!loggedInUser || loggedInUser.unvan !== 'Formen') return;

        try {
            logMessage("[SİSTEM] Personel listesi senkronize ediliyor...");
            // Listeyi indirmek için GAS'a GET isteği at (doGet listeyi döner)
            let response = await fetch(API_URL); 
            let textData = await response.text();
            let result = JSON.parse(textData);
            
            if (result.status === "success") {
                globalPersonnelList = result.personeller;
                let select = document.getElementById('personSelect');
                select.innerHTML = '<option value="">-- Personel Seçin --</option>';
                globalPersonnelList.forEach(p => {
                    let opt = document.createElement('option');
                    opt.value = p.id + " (" + p.ad + ")"; // 'ID (Ad Soyad)' formatında
                    opt.textContent = p.ad;
                    select.appendChild(opt);
                });
                logMessage("[BAŞARILI] Personel listesi yüklendi.");
            } else {
                logMessage(`[HATA] Personel listesi yüklenemedi: ${result.message}`);
            }
        } catch (e) {
            logMessage("[HATA] Personel listesi indirilemedi. (Offline?)");
        }
    }
    // ------------------------------------

    function updateNetworkStatus() {
        const statusDiv = document.getElementById('networkStatus');
        if (navigator.onLine) {
            statusDiv.textContent = '📡 Çevrimiçi (Online) - Güvenli Senkronizasyon';
            statusDiv.classList.remove('offline');
            syncOfflineQueue();
        } else {
            statusDiv.textContent = '⚠️ Çevrimdışı (Offline) - Veriler Cihaza Kaydedilecek';
            statusDiv.classList.add('offline');
        }
    }

    function setMode(mode) {
        if (!loggedInUser) { alert("Lütfen önce giriş yapın!"); return; }
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');
        
        // Butonu ve veriyi sıfırla
        const submitBtn = document.getElementById('submitPersonBtn');
        submitBtn.style.display = 'none'; 
        submitBtn.disabled = true;
        compressedBase64 = ""; 

        // GİRİŞ/ÇIKIŞ Modları (NFC tabanlı, fotoğraf yok)
        if (mode === 'GİRİŞ' || mode === 'ÇIKIŞ') {
            document.getElementById('nfcBtn').style.display = 'block';
            document.getElementById('personnelBox').style.display = 'none';
            document.getElementById('fileUploadBox').style.display = 'none';
            updateStatus(`${mode} seçildi. Önce Konum alınız.`, "#cce5ff", "#004085");
        } 
        // İZİNLİ/RAPORLU Modları (Belge tabanlı, fotoğraf var, yetki ayrımı var)
        else if(mode === 'İZİNLİ' || mode === 'RAPORLU') {
            document.getElementById('nfcBtn').style.display = 'none';
            document.getElementById('personnelBox').style.display = 'block';
            document.getElementById('fileUploadBox').style.display = 'block';
            
            // --- Formen/User Yetki Ayrımı ---
            if (loggedInUser.unvan === 'Formen') {
                document.getElementById('formenPanel').style.display = 'block';
                document.getElementById('userPanel').style.display = 'none';
            } else {
                document.getElementById('formenPanel').style.display = 'none';
                document.getElementById('userPanel').style.display = 'block';
            }
            updateStatus(`${mode} seçildi. Önce Konum alınız.`, "#cce5ff", "#004085");
        }
        
        document.getElementById('gpsBtn').disabled = false;
        document.getElementById('nfcBtn').disabled = true;
        verifiedGps = { lat: null, lng: null }; 
    }

    function getLiveLocation() {
        if (!currentMode) { alert("Lütfen önce işlem tipi seçiniz."); return; }
        updateStatus("GPS aranıyor...", "#fff3cd", "#856404");
        document.getElementById('gpsBtn').disabled = true;

        if (!navigator.geolocation) { alert("Tarayıcı GPS desteklemiyor."); return; }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                verifiedGps.lat = position.coords.latitude;
                verifiedGps.lng = position.coords.longitude;
                updateStatus(`Konum Alındı, belge fotoğrafı çekin veya kart okutun.`, "#d4edda", "#155724");
                logMessage(`[GPS OK] Koordinat alındı.`);

                if(currentMode === 'İZİNLİ' || currentMode === 'RAPORLU') {
                    // Kaydet butonu fotoğraf sıkıştırılınca açılacak
                } else {
                    // Giriş/Çıkış modları için NFC'yi aktif et
                    document.getElementById('nfcBtn').disabled = false;
                    logMessage("Sistem kart okumaya hazır.");
                }
            },
            (error) => {
                updateStatus(`GPS Hatası: ${error.message}`, "#f8d7da", "#721c24");
                document.getElementById('gpsBtn').disabled = false;
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    // --- Fotoğraf Sıkıştırma Fonksiyonları (İZİNLİ/RAPORLU için) ---
    function handleFileSelect(input) {
        const file = input.files[0];
        if (file) {
            document.getElementById('uploadStatus').innerText = "🔄 Sıkıştırılıyor...";
            document.getElementById('submitPersonBtn').disabled = true;
            document.getElementById('submitPersonBtn').style.display = 'none'; 
            
            const reader = new FileReader();
            reader.onload = function(e) {
                // Resmi sıkıştır (maxWidth: 1200px, kalite: 0.7)
                compressImage(e.target.result, 1200, 0.7);
            };
            reader.readAsDataURL(file);
        }
    }

    function compressImage(base64, maxWidth, quality) {
        const img = new Image();
        img.src = base64;
        img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
                height = Math.round(height * (maxWidth / width));
                width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            
            compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            const compressedSize = (compressedBase64.length * 0.75 / 1024).toFixed(1);
            
            logMessage(`[RESİM] Sıkıştırıldı (${compressedSize} KB).`);
            document.getElementById('uploadStatus').innerText = `✅ Hazır. (${compressedSize} KB)`;
            
            // Fotoğraf hazır ve Konum alındıysa Butonu Göster
            if (verifiedGps.lat !== null) {
                const btn = document.getElementById('submitPersonBtn');
                btn.style.display = 'block'; // Görünür yap
                btn.disabled = false;    // Tıklanabilir yap
                btn.innerText = "Verileri ve Durumu Kaydet"; 
            }
        };
    }
    // ----------------------------------------------

    // --- İZİNLİ/RAPORLU Veri Gönderme Mantığı (Extra Veri Dahil) ---
    async function submitPersonnelStatus() {
        const s = document.getElementById('personSelect');
        let targetPersonnel;

        // Formen/User Ayrımına göre target_personel'i belirle
        if (loggedInUser.unvan === 'Formen') {
            if (!s.value) { alert("Lütfen bir personel seçin!"); return; }
            targetPersonnel = s.value; // 'ID (Ad Soyad)'
        } else {
            // User ise kendi adını ID dâhil al
            targetPersonnel = loggedInUser.id + " (" + loggedInUser.ad + ")"; 
        }

        updateStatus(`Veriler gönderiliyor...`, "#fff3cd", "#856404");
        document.getElementById('submitPersonBtn').disabled = true;
        logMessage(`[AĞ] Gönderiliyor: ${targetPersonnel} Durumu...`);

        // Extra verileri topla
        const userAgentString = navigator.userAgent;
        let publicIP = "Public IP Alınamadı";
        try {
            const ipResponse = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipResponse.json();
            publicIP = ipData.ip;
        } catch (ipError) { console.warn("Public IP alınamadı."); }

        let data = {
            token: AUTH_TOKEN,
            action: 'save_data', // doPost içindeki hedef fonksiyon
            islem_tipi: currentMode,
            target_personel: targetPersonnel, // lookup'a girecek veri
            konum: verifiedGps.lat + ", " + verifiedGps.lng,
            senkron_durumu: navigator.onLine ? "Canlı İletim" : "Cihazdan Senkronize",
            image_base64: compressedBase64, // Belge fotoğrafı
            image_type: "image/jpeg",
            
            // --- EXTRA VERİLER ---
            gönderen_personel: loggedInUser.ad, // Giriş yapan kişi
            ip_adresi: publicIP, // Cihazın public IP'si
            cihaz_bilgisi: userAgentString // navigator.userAgent
        };
        
        await processRecord(data);
        
        // Formu sıfırla
        if (loggedInUser.unvan === 'Formen') { s.value = ""; }
        document.getElementById('fileUploadBox').style.display = 'none';
        compressedBase64 = "";
        document.getElementById('uploadStatus').innerText = "Hazır.";
        document.getElementById('submitPersonBtn').style.display = 'none';
    }
    // ----------------------------------------------

    // --- GİRİŞ/ÇIKIŞ NFC Kart Okuma Mantığı ---
    async function startNfcScan() {
        if (!('NDEFReader' in window)) { alert("Web NFC bu cihazda desteklenmiyor."); return; }
        try {
            const ndef = new NDEFReader();
            await ndef.scan();
            updateStatus(`NFC Aktif! Kart okutun... (${currentMode})`, "#cce5ff", "#004085");
            logMessage(`[NFC] Tarayıcı aktif, kart okutun.`);

            ndef.onreading = async (event) => {
                playBip();
                let uid = event.serialNumber;
                updateStatus(`KART OKUNDU: ${uid}`, "#d4edda", "#155724");
                logMessage(`[NFC] Kart UID: ${uid}. Veri hazırlanıyor...`);
                
                // NFC verisinde fotoğraf yok, extra veriler doPOST'ta lookup yapılması için hazırlanır.
                let data = {
                    token: AUTH_TOKEN,
                    action: 'save_data',
                    islem_tipi: currentMode,
                    target_personel: uid, // Lookup yapılması için RAW UID'yi gönder
                    konum: verifiedGps.lat + ", " + verifiedGps.lng,
                    senkron_durumu: navigator.onLine ? "Canlı İletim" : "Cihazdan Senkronize",
                    image_base64: "", // NFC'de fotoğraf yok
                    image_type: "",
                    
                    // Gönderen kişi
                    gönderen_personel: loggedInUser.ad,
                    ip_adresi: navigator.onLine ? "Canlı lookup (fetch tetiklenmedi)" : "Cihazda lookup (Offline)",
                    cihaz_bilgisi: navigator.userAgent
                };
                await processRecord(data);
            };
        } catch (error) { logMessage(`[NFC HATA] ${error}`); }
    }

    // --- Ortak Kayıt ve Senkron Mantığı ---
    async function processRecord(data) {
        if (navigator.onLine) { logMessage(`[AĞ] Sunucuya gönderiliyor...`); if (await sendToGoogleSheets(data)) return; }
        
        // Offline ise kuyruğa ekle
        let queue = JSON.parse(localStorage.getItem('pdksQueue') || "[]");
        // Offline kuyruğuna gönderirken IP'yi boş bırak
        data.ip_adresi = "Cihazda Kayıt (Offline)";
        
        queue.push(data);
        localStorage.setItem('pdksQueue', JSON.stringify(queue));
        logMessage(`[ÇEVRİMDIŞI] Cihaza kaydedildi (${queue.length} bekleyen). Senkron internet geldiğinde yapılacak.`);
        updateStatus(`İnternet Yok. Cihaza Kaydedildi!`, "#fff3cd", "#856404");
    }

    async function sendToGoogleSheets(data) {
        try {
            let response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(data)
            });
            
            let textData = await response.text();
            let result = JSON.parse(textData);

            if (result.status === "success") {
                logMessage(`[BAŞARILI] Kayıt sunucuya işlendi.`);
                updateStatus("Kayıt Tamamlandı!", "#d4edda", "#155724");
                return true;
            } else {
                logMessage(`[REDDEDİLDİ] Sunucu hatası: ${result.message}`);
                return false;
            }
        } catch (error) {
            logMessage(`[HATA] İletim başarısız. Cihaza kaydedildi.`);
            return false;
        }
    }

    async function syncOfflineQueue() {
        let queue = JSON.parse(localStorage.getItem('pdksQueue') || "[]");
        if (queue.length === 0) return;

        logMessage(`[SENKRON] ${queue.length} bekleyen kayıt iletiliyor...`);
        let rem = [];
        
        for (let record of queue) {
            // Offline kuyruktan senkronize ederken IP adresi "Cihazda Kayıt (Offline)" olarak kalır.
            if (!(await sendToGoogleSheets(record))) {
                rem.push(record); // Başarısızsa kuyruğa geri ekle
            }
        }
        
        localStorage.setItem('pdksQueue', JSON.stringify(rem));
        logMessage(`[SENKRON] Tamamlandı. Kuyruk temizlendi.`);
    }

    function updateStatus(text, bg, color) {
        const box = document.getElementById('statusBox');
        box.innerText = text; box.style.backgroundColor = bg; box.style.color = color;
    }

    function logMessage(text) {
        const box = document.getElementById('logBox');
        let timeStr = new Date().toLocaleTimeString('tr-TR');
        box.innerHTML += `[${timeStr}] ${text}<br>`;
        box.scrollTop = box.scrollHeight;
    }

    function playBip() {
        try {
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            osc.connect(ctx.destination);
            osc.frequency.value = 900;
            osc.start();
            setTimeout(() => { osc.stop(); }, 150);
        } catch(e) {}
    }
</script>
</body>
</html>
