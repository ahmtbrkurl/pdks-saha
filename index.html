let cachedPublicIPv6="";
let cachedPublicIPAtV6=0;
const NFC_QUEUE_KEY_V6="pdksNfcFastQueueV6";
const NFC_WORKER_DELAY_V6=25;
const PUBLIC_IP_CACHE_MS_V6=30*60*1000;

function loadNfcQueueV6(){
  try{
    nfcQueueV6=JSON.parse(localStorage.getItem(NFC_QUEUE_KEY_V6)||"[]");
    if(!Array.isArray(nfcQueueV6)) nfcQueueV6=[];
  }catch(e){nfcQueueV6=[];}
  updateNfcQueueIndicatorV6();
}

function saveNfcQueueV6(){
  // LocalStorage başarısız olsa bile NFC akışı durmamalı.
  // Ana kuyruk RAM'de tutulur; persistence sadece ek güvenliktir.
  try{
    localStorage.setItem(NFC_QUEUE_KEY_V6,JSON.stringify(nfcQueueV6));
  }catch(e){
    logError(
      `[NFC QUEUE STORAGE] ${e&&e.message?e.message:e}`,
      "QUEUE_STORAGE_ERROR",
      currentMode||"",
      ""
    );
  }
  updateNfcQueueIndicatorV6();
}

function updateNfcQueueIndicatorV6(){
  const el=document.getElementById("nfcQueueIndicatorV6");
  if(el) el.textContent=`Bekleyen NFC: ${nfcQueueV6.length}`;
}

function isPermanentNfcErrorV6(err){
  const code=String(err&&err.code||"").toUpperCase();
  return ["FORBIDDEN","NFC_UNKNOWN","NFC_UID_MISSING","TARGET_MISSING","TARGET_NOT_FOUND","SESSION_INVALID"].includes(code);
}

async function getCachedPublicIPv6(force=false){
  const now=Date.now();
  if(!force&&cachedPublicIPv6&&now-cachedPublicIPAtV6<PUBLIC_IP_CACHE_MS_V6)
    return cachedPublicIPv6;
  try{
    const r=await fetch("https://api.ipify.org?format=json",{cache:"no-store"});
    const j=await r.json();
    if(j&&j.ip){
      cachedPublicIPv6=j.ip;
      cachedPublicIPAtV6=Date.now();
    }
  }catch(e){}
  return cachedPublicIPv6||"Bilinmeyen IP";
}

function queueNfcRecordV6(data){
  nfcQueueV6.push(data);
  saveNfcQueueV6();

  logMessage(
    `[NFC QUEUE] UID=${data.nfc_uid||"YOK"} eklendi. Queue=${nfcQueueV6.length}`
  );

  runNfcWorkerV6();
}

async function runNfcWorkerV6(){
  if(nfcWorkerRunningV6||!navigator.onLine||!nfcQueueV6.length) return;
  nfcWorkerRunningV6=true;
  try{
    while(nfcQueueV6.length&&navigator.onLine){
      const record=nfcQueueV6[0];
      try{
        logMessage(`[NFC SYNC] Gönderiliyor UID=${record.nfc_uid||"YOK"}`);
        await apiPost(record);
        nfcQueueV6.shift();
        saveNfcQueueV6();
        logMessage(`[NFC SYNC] Kayıt gönderildi. Kalan=${nfcQueueV6.length}`);
      }catch(e){
        const msg=e&&e.message?e.message:String(e);
        logError(
          `[NFC SYNC ERROR] ${msg}`,
          e&&e.code ? e.code : "NFC_SYNC_ERROR",
          record.islem_tipi,
          record.nfc_uid||""
        );

        if(isPermanentNfcErrorV6(e)){
          nfcQueueV6.shift();
          saveNfcQueueV6();
          logError(`[NFC SYNC DISCARDED] ${msg}`,"SYNC_DISCARDED",record.islem_tipi,record.nfc_uid||"");
          continue;
        }
        logError(`[NFC SYNC NETWORK] ${msg}`,"NETWORK_ERROR",record.islem_tipi,record.nfc_uid||"");
        break;
      }
      await new Promise(r=>setTimeout(r,NFC_WORKER_DELAY_V6));
    }
  }finally{
    nfcWorkerRunningV6=false;
    updateNfcQueueIndicatorV6();
  }
}

function createFastNfcRecordV6(uid){
  return {
    // V6.3 kritik düzeltme:
    // Backend save_data artık session doğrulaması yapıyor.
    // Fast NFC kuyruğu da normal kayıtlar gibi aktif oturum tokenını göndermeli.
    action:"save_data",
    session:sessionToken,
    token:AUTH_TOKEN,
    islem_tipi:currentMode,
    nfc_uid:uid,
    target_personel_id:"",
    konum:verifiedGps.lat+", "+verifiedGps.lng,
    senkron_durumu:navigator.onLine?"Canlı İletim":"Cihazdan Senkronize",
    image_base64:"",
    image_type:"",
    gönderen_personel:loggedInUser.ad,
    ip_adresi:cachedPublicIPv6||"IP Alınamadı",
    cihaz_bilgisi:navigator.userAgent,
    client_record_id:"NFC-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)
  };
}

function tr(key){
  const lang = localStorage.getItem(STORAGE_LANG_KEY) || "tr";
  return (T[lang] && T[lang][key]) || T.tr[key] || key;
}

function setLanguage(lang){
  if(!T[lang]) lang="tr";
  localStorage.setItem(STORAGE_LANG_KEY,lang);
  document.getElementById("languageSelect").value=lang;
  applyLanguage();
}

function applyLanguage(){
  const lang=localStorage.getItem(STORAGE_LANG_KEY)||"tr";
  document.documentElement.lang=lang;
  document.getElementById("title").textContent=tr("title");
  document.getElementById("statusBox").textContent=tr("statusLoginFirst");
  document.getElementById("usernameLabel").textContent=tr("username");
  document.getElementById("passwordLabel").textContent=tr("password");
  document.getElementById("loginBtn").textContent=tr("login");
  document.getElementById("gpsBtn").textContent=tr("location");
  document.getElementById("nfcBtn").textContent=tr("nfc");
  document.getElementById("btn-GİRİŞ").textContent=tr("entry");
  document.getElementById("btn-ÇIKIŞ").textContent=tr("exit");
  document.getElementById("btn-İZİNLİ").textContent=tr("leave");
  document.getElementById("btn-RAPORLU").textContent=tr("sick");
  document.getElementById("personSelectLabel").textContent=tr("personSelect");
  document.getElementById("userPanelText").textContent=tr("userPanel");
  document.getElementById("photoLabel").textContent=tr("photo");
  document.getElementById("uploadStatus").textContent=tr("ready");
  document.getElementById("submitPersonBtn").textContent=tr("save");
  document.getElementById("onSiteTitle").textContent=tr("site");
  document.getElementById("onSiteUnit").textContent=tr("person");
  document.getElementById("reportTitle").textContent=tr("report");
  document.getElementById("previewText").textContent=tr("show");
  document.getElementById("printText").textContent=tr("print");
  document.getElementById("networkStatus").textContent=navigator.onLine?tr("online"):tr("offline");
  if(!loggedInUser) document.getElementById("statusBox").textContent=tr("loginFirst");
}

window.addEventListener("online",updateNetworkStatus);
window.addEventListener("offline",updateNetworkStatus);
window.addEventListener("load",initializeApp);

function initializeApp(){
  loadNfcQueueV6();
  getCachedPublicIPv6(false);
  runNfcWorkerV6();
  const lang=localStorage.getItem(STORAGE_LANG_KEY)||"tr";
  document.getElementById("languageSelect").value=lang;
  applyLanguage();
  setToday();
  updateNetworkStatus();
  logMessage("[SYSTEM] Terminal ready.");
  if(navigator.onLine)flushErrorReportQueue();
}

function setToday(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  document.getElementById("reportDate").value=`${y}-${m}-${day}`;
}

async function doUserLogin(){
  const uName=document.getElementById("usernameInput").value.trim();
  const uPass=document.getElementById("passwordInput").value;

  if(!uName || !uPass){
    alert(`${tr("username")} ${tr("password")}`);
    return;
  }

  const btn=document.getElementById("loginBtn");
  btn.disabled=true;
  updateStatus("...", "#fff3cd", "#856404");

  try{
    const result=await apiPost({
      action:"login",
      username:uName,
      password:uPass
    },false);

    if(result.status!=="success") throw new Error(result.message||"Login failed");

    sessionToken=result.session;
    loggedInUser=result.user;

    document.getElementById("loginBox").style.background="#d4edda";
    document.getElementById("userInfo").classList.remove("hidden");
    document.getElementById("userInfo").textContent=
      `${loggedInUser.ad} (${loggedInUser.unvan})`;

    document.querySelectorAll(".mode-btn").forEach(b=>b.disabled=false);
    document.getElementById("reportBox").style.display=
      loggedInUser.unvan.toLowerCase()==="formen" ? "block":"none";

    updateStatus(tr("loginSuccess"),"#d4edda","#155724");
    logMessage(`[LOGIN] ${loggedInUser.ad} (${loggedInUser.unvan})`);

    if(loggedInUser.unvan.toLowerCase()==="formen"){
      await loadPersonnelListForFormen();
      await loadSiteCount();
      startSiteCountTimer();
    }

    await syncOfflineQueue();

  }catch(err){
    btn.disabled=false;
    updateStatus("Login failed","#f8d7da","#721c24");
    alert(err.message||"Login failed");
  }
}

async function logout(){
  if(sessionToken){
    try{ await apiPost({action:"logout",session:sessionToken},false); }catch(e){}
  }
  sessionToken=null;
  loggedInUser=null;
  currentMode=null;
  stopSiteCountTimer();
  location.reload();
}

async function loadPersonnelListForFormen(){
  if(!loggedInUser || loggedInUser.unvan.toLowerCase()!=="formen") return;

  const result=await apiPost({
    action:"get_personnel",
    session:sessionToken
  });

  globalPersonnelList=result.personeller||[];
  const select=document.getElementById("personSelect");
  select.innerHTML="";

  const first=document.createElement("option");
  first.value="";
  first.textContent="-- "+tr("personSelect")+" --";
  select.appendChild(first);

  globalPersonnelList.forEach(p=>{
    const opt=document.createElement("option");
    opt.value=p.id;
    opt.textContent=`${p.id} (${p.ad})`;
    select.appendChild(opt);
  });
}

function setMode(mode){
  if(!loggedInUser){alert(tr("loginFirst"));return;}

  currentMode=mode;
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+mode).classList.add("active");

  verifiedGps={lat:null,lng:null};
  compressedBase64="";
  document.getElementById("submitPersonBtn").style.display="none";
  document.getElementById("submitPersonBtn").disabled=true;
  document.getElementById("cameraInput").value="";
  document.getElementById("uploadStatus").textContent=tr("ready");

  if(mode==="GİRİŞ" || mode==="ÇIKIŞ"){
    document.getElementById("nfcBtn").style.display="block";
    document.getElementById("personnelBox").style.display="none";
    document.getElementById("fileUploadBox").style.display="none";
    updateStatus(mode+" - "+tr("location"),"#cce5ff","#004085");
  }else{
    document.getElementById("nfcBtn").style.display="none";
    document.getElementById("personnelBox").style.display="block";
    document.getElementById("fileUploadBox").style.display="block";

    if(loggedInUser.unvan.toLowerCase()==="formen"){
      document.getElementById("formenPanel").style.display="block";
      document.getElementById("userPanel").style.display="none";
    }else{
      document.getElementById("formenPanel").style.display="none";
      document.getElementById("userPanel").style.display="block";
    }
    updateStatus(mode+" - "+tr("location"),"#cce5ff","#004085");
  }

  document.getElementById("gpsBtn").disabled=false;
  document.getElementById("nfcBtn").disabled=true;
}

function getLiveLocation(){
  if(!currentMode){alert(tr("loginFirst"));return;}

  if(!navigator.geolocation){
    alert("GPS unavailable");
    return;
  }

  document.getElementById("gpsBtn").disabled=true;
  updateStatus(tr("gps"),"#fff3cd","#856404");

  navigator.geolocation.getCurrentPosition(
    position=>{
      verifiedGps.lat=position.coords.latitude;
      verifiedGps.lng=position.coords.longitude;
      logMessage(`[GPS] ${verifiedGps.lat}, ${verifiedGps.lng}`);

      if(currentMode==="GİRİŞ" || currentMode==="ÇIKIŞ"){
        document.getElementById("nfcBtn").disabled=false;
        updateStatus(tr("gpsOk")+" "+tr("nfcActive"),"#d4edda","#155724");
      }else{
        updateStatus(tr("photoNeeded"),"#d4edda","#155724");
      }
    },
    error=>{
      document.getElementById("gpsBtn").disabled=false;
      updateStatus("GPS: "+error.message,"#f8d7da","#721c24");
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function handleFileSelect(input){
  const file=input.files&&input.files[0];
  if(!file)return;

  if(file.size>8*1024*1024){
    alert("Photo too large.");
    input.value="";
    return;
  }

  document.getElementById("uploadStatus").textContent="Compressing...";
  document.getElementById("submitPersonBtn").disabled=true;
  document.getElementById("submitPersonBtn").style.display="none";

  const reader=new FileReader();
  reader.onload=e=>compressImage(e.target.result,1200,0.7);
  reader.readAsDataURL(file);
}

function compressImage(base64,maxWidth,quality){
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    if(w>maxWidth){
      h=Math.round(h*(maxWidth/w));
      w=maxWidth;
    }
    const canvas=document.createElement("canvas");
    canvas.width=w;canvas.height=h;
    canvas.getContext("2d").drawImage(img,0,0,w,h);
    compressedBase64=canvas.toDataURL("image/jpeg",quality);

    const kb=(compressedBase64.length*0.75/1024).toFixed(1);
    document.getElementById("uploadStatus").textContent=`${tr("ready")} (${kb} KB)`;

    if(verifiedGps.lat!==null){
      document.getElementById("submitPersonBtn").style.display="block";
      document.getElementById("submitPersonBtn").disabled=false;
    }
  };
  img.onerror=()=>{document.getElementById("uploadStatus").textContent="Photo error";};
  img.src=base64;
}

async function submitPersonnelStatus(){
  if(!verifiedGps.lat || !compressedBase64){
    alert(tr("photoNeeded"));
    return;
  }

  let targetId="";

  if(loggedInUser.unvan.toLowerCase()==="formen"){
    targetId=document.getElementById("personSelect").value;
    if(!targetId){alert(tr("choosePerson"));return;}
  }else{
    targetId=loggedInUser.id;
  }

  const btn=document.getElementById("submitPersonBtn");
  btn.disabled=true;

  const data={
    action:"save_data",
    session:sessionToken,
    islem_tipi:currentMode,
    target_personel_id:targetId,
    konum:`${verifiedGps.lat}, ${verifiedGps.lng}`,
    senkron_durumu:navigator.onLine?"Canlı İletim":"Cihazdan Senkronize",
    image_base64:compressedBase64,
    image_type:"image/jpeg",
    event_time:new Date().toISOString(),
    ip_adresi:await getPublicIP(),
    cihaz_bilgisi:navigator.userAgent
  };

  await processRecord(data);

  document.getElementById("submitPersonBtn").style.display="none";
  document.getElementById("cameraInput").value="";
  compressedBase64="";
  verifiedGps={lat:null,lng:null};
  currentMode=null;
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("gpsBtn").disabled=true;
  document.getElementById("nfcBtn").disabled=true;
  document.getElementById("fileUploadBox").style.display="none";
  document.getElementById("personnelBox").style.display="none";
  updateStatus(tr("sent"),"#d4edda","#155724");

  if(loggedInUser.unvan.toLowerCase()==="formen") await loadSiteCount();
}


async function sendErrorReport(payload){
  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        action:"log_client_error",
        user:payload.user,
        action_name:payload.action_name,
        error_type:payload.error_type,
        error_message:payload.error_message,
        uid:payload.uid,
        konum:payload.konum,
        device:payload.device,
        terminal_log:payload.terminal_log
      })
    });

    const text=await response.text();
    let result;

    try{
      result=JSON.parse(text);
    }catch(e){
      throw new Error("Hata sunucusu JSON döndürmedi. HTTP="+response.status);
    }

    if(result.status!=="success"){
      throw new Error(result.message||"Hata logu reddedildi.");
    }

    return true;
  }catch(e){
    return false;
  }
}

function queueErrorReport(payload){
  try{
    let queue=JSON.parse(localStorage.getItem(ERROR_QUEUE_KEY)||"[]");
    queue.push(payload);
    if(queue.length>50) queue=queue.slice(-50);
    localStorage.setItem(ERROR_QUEUE_KEY,JSON.stringify(queue));
  }catch(e){}
}

async function reportTerminalError(errorType,message,actionName="",uid=""){
  const payload={
    user:loggedInUser ? loggedInUser.ad : "Giriş yapılmamış",
    action_name:actionName||currentMode||"Bilinmeyen",
    error_type:errorType||"CLIENT_ERROR",
    error_message:String(message||"Bilinmeyen hata"),
    uid:String(uid||""),
    konum:(verifiedGps.lat!==null && verifiedGps.lng!==null)
      ? `${verifiedGps.lat}, ${verifiedGps.lng}` : "",
    device:navigator.userAgent,
    terminal_log:document.getElementById("logBox")
      ? document.getElementById("logBox").innerText.slice(-10000) : ""
  };

  if(navigator.onLine){
    const sent=await sendErrorReport(payload);
    if(!sent) queueErrorReport(payload);
  }else{
    queueErrorReport(payload);
  }
}

async function flushErrorReportQueue(){
  if(!navigator.onLine)return;

  let queue=[];
  try{
    queue=JSON.parse(localStorage.getItem(ERROR_QUEUE_KEY)||"[]");
  }catch(e){
    queue=[];
  }

  if(!queue.length)return;

  const remaining=[];

  for(const item of queue){
    if(!(await sendErrorReport(item))) remaining.push(item);
  }

  localStorage.setItem(ERROR_QUEUE_KEY,JSON.stringify(remaining));

  if(remaining.length===0){
    logMessage("[HATA SYNC] Bekleyen hata raporları gönderildi.");
  }else{
    logMessage(`[HATA SYNC] ${remaining.length} hata raporu bekliyor.`);
  }
}

function logError(text,errorType="CLIENT_ERROR",actionName="",uid=""){
  const box=document.getElementById("logBox");
  const line=document.createElement("div");
  line.style.color="#ff4d4d";
  line.style.fontWeight="bold";
  line.textContent=`[${new Date().toLocaleTimeString("tr-TR")}] ${text}`;
  box.appendChild(line);
  box.scrollTop=box.scrollHeight;

  // Kullanıcıya hata gösterilir; yöneticiye arka planda gönderilir.
  reportTerminalError(errorType,text,actionName,uid);
}


async function startNfcScan(){
  if(!("NDEFReader" in window)){
    alert("Web NFC bu cihazda desteklenmiyor.");
    return;
  }

  if(!currentMode||(currentMode!=="GİRİŞ"&&currentMode!=="ÇIKIŞ")){
    alert("Önce GİRİŞ veya ÇIKIŞ seçin.");
    return;
  }

  if(verifiedGps.lat===null){
    alert("Önce konum alın.");
    return;
  }

  try{
    // V6.2: Kullanıcının çalışan V5 akışındaki Web NFC modelini koruyoruz.
    // Reader referansı global tutuluyor ama event property doğrudan atanıyor.
    nfcReaderV6=new NDEFReader();

    // Önceden kuyruğa girmiş kayıtlar arka planda gönderilsin.
    getCachedPublicIPv6(false);
    runNfcWorkerV6();

    await nfcReaderV6.scan();

    updateStatus(
      `${currentMode} - NFC aktif. Kartları seri şekilde okutabilirsiniz.`,
      "#cce5ff","#004085"
    );
    logMessage("[NFC] Tarama aktif. Seri kart okuma hazır.");

    // ÖNEMLİ:
    // V5'te çalışan event modelini aynen koruyoruz.
    // Burada await YOK; kart okuma sunucuya bağlı değil.
    nfcReaderV6.onreading=(event)=>{
      const uid=String(event.serialNumber||"").trim();

      logMessage(`[NFC EVENT] Kart event alındı. UID=${uid||"YOK"}`);

      if(!uid){
        logError("[NFC] UID alınamadı.","NFC_UID_MISSING",currentMode,"");
        return;
      }

      playBip();

      try{
        const data=createFastNfcRecordV6(uid);

        // Anında lokal kuyruğa ekle.
        queueNfcRecordV6(data);

        logMessage(
          `[NFC] UID=${uid} → KUYRUKLANDI. Bekleyen=${nfcQueueV6.length}`
        );
      }catch(e){
        const msg=e&&e.message?e.message:String(e);
        logError(
          `[NFC CLIENT ERROR] ${msg}`,
          "NFC_CLIENT_ERROR",
          currentMode,
          uid
        );
      }

      updateStatus(
        `KART OKUNDU: ${uid} — Sıradaki kartı okutabilirsiniz.`,
        "#d4edda","#155724"
      );
    };

    nfcReaderV6.onreadingerror=()=>{
      logError(
        "[NFC READ ERROR] Kart okunamadı.",
        "NFC_READ_ERROR",
        currentMode,
        ""
      );
    };

  }catch(error){
    logError(
      `[NFC HATA] ${error&&error.message?error.message:error}`,
      "NFC_ERROR",
      currentMode||"",
      ""
    );
  }
}

async function handleNfcReading(event){
  if(!loggedInUser || !currentMode) return;

  // Aynı kartın çok hızlı arka arkaya event üretmesi durumunda
  // aynı PDKS isteğini paralel çalıştırma.
  if(nfcProcessing){
    logMessage("[NFC] Önceki kart işlemi tamamlanıyor; bu okuma bekletildi.");
    return;
  }

  const uid=String(event.serialNumber||"").trim();

  if(!uid){
    logError("[NFC ERROR] UID alınamadı.","NFC_READ_ERROR",currentMode,"");
    updateStatus("NFC UID unavailable","#f8d7da","#721c24");
    return;
  }

  nfcProcessing=true;
  playBip();
  logMessage(`[NFC] UID=${uid}`);

  const data={
    action:"save_data",
    session:sessionToken,
    islem_tipi:currentMode,
    nfc_uid:uid,
    konum:`${verifiedGps.lat}, ${verifiedGps.lng}`,
    senkron_durumu:navigator.onLine?"Canlı İletim":"Cihazdan Senkronize",
    image_base64:"",
    image_type:"",
    event_time:new Date().toISOString(),
    ip_adresi:await getPublicIP(),
    cihaz_bilgisi:navigator.userAgent
  };

  try{
    await processRecord(data);

    // Grup NFC taraması devam eder.
    updateStatus(tr("nfcActive"),"#cce5ff","#004085");
    if(loggedInUser.unvan.toLowerCase()==="formen") await loadSiteCount();
  }finally{
    nfcProcessing=false;
  }
}

function isNonRetryableError(err){
  const code=String(err && err.code || "").toUpperCase();
  return [
    "FORBIDDEN",
    "NFC_UNKNOWN",
    "NFC_UID_MISSING",
    "TARGET_MISSING",
    "TARGET_NOT_FOUND",
    "SESSION_INVALID"
  ].includes(code);
}

async function processRecord(data){
  if(navigator.onLine){
    try{
      const result=await apiPost(data);

      if(result.status==="success"){
        logMessage(result.duplicate?"[SERVER] Duplicate ignored.":"[SERVER] Saved.");
        updateStatus(tr("sent"),"#d4edda","#155724");
        return true;
      }

      // apiPost normalde hata fırlatır; güvenlik için burada da kontrol ediyoruz.
      const msg=result.message||"Sunucu kaydı başarısız.";
      logError(`[SERVER ERROR] ${msg}`,"SERVER_REJECTED",data.islem_tipi,data.nfc_uid||"");
    }catch(e){
      const msg=e && e.message ? e.message : String(e);

      if(isNonRetryableError(e)){
        const code=String(e && e.code || "").toUpperCase();

        if(code==="FORBIDDEN" || code==="NFC_UNKNOWN"){
          logError(
            `[SECURITY] Yetkisiz NFC denemesi. UID=${data.nfc_uid||"YOK"} - ${msg}`,
            "SECURITY",
            data.islem_tipi,
            data.nfc_uid||""
          );
        }else{
          logError(
            `[SERVER REJECTED] ${msg}`,
            "SERVER_REJECTED",
            data.islem_tipi,
            data.nfc_uid||""
          );
        }

        // Kalıcı yetki/veri hataları tekrar kuyruğa alınmaz.
        return false;
      }

      logError(`[NETWORK ERROR] ${msg}`,"NETWORK_ERROR",data.islem_tipi,data.nfc_uid||"");
    }
  }else{
    logError("[NETWORK ERROR] Cihaz çevrimdışı.","NETWORK_ERROR",data.islem_tipi,data.nfc_uid||"");
  }

  data.senkron_durumu="Cihazdan Senkronize";
  data.ip_adresi="Cihazda Kayıt (Offline)";
  data.event_time=data.event_time||new Date().toISOString();

  const queue=JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");
  queue.push(data);
  localStorage.setItem(QUEUE_KEY,JSON.stringify(queue));

  updateStatus(tr("offlineSaved"),"#fff3cd","#856404");
  logMessage(`[OFFLINE] Kayıt kuyruğa alındı. Queue=${queue.length}`);
  return false;
}

async function syncOfflineQueue(){
  if(!navigator.onLine || !sessionToken)return;

  const queue=JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");
  if(!queue.length)return;

  logMessage(`[SYNC] Bekleyen kayıt=${queue.length}`);

  const remaining=[];

  for(const record of queue){
    try{
      const result=await apiPost(record);

      if(result.status==="success"){
        logMessage("[SYNC] Bekleyen kayıt gönderildi.");
      }else{
        if(isNonRetryableError(result)){
          logError(
            `[SYNC DISCARDED] ${result.message||"Kalıcı sunucu hatası"}`,
            "SYNC_DISCARDED",
            record.islem_tipi,
            record.nfc_uid||""
          );
        }else{
          remaining.push(record);
          logError(
            `[SYNC SERVER ERROR] ${result.message||"Bilinmeyen hata"}`,
            "SERVER_REJECTED",
            record.islem_tipi,
            record.nfc_uid||""
          );
        }
      }

    }catch(e){
      const msg=e && e.message ? e.message : String(e);

      if(isNonRetryableError(e)){
        logError(
          `[SYNC DISCARDED] ${msg}`,
          "SYNC_DISCARDED",
          record.islem_tipi,
          record.nfc_uid||""
        );
        // FORBIDDEN / NFC_UNKNOWN gibi kalıcı hatalar tekrar kuyruğa alınmaz.
        continue;
      }

      remaining.push(record);
      logError(
        `[SYNC NETWORK ERROR] ${msg}`,
        "NETWORK_ERROR",
        record.islem_tipi,
        record.nfc_uid||""
      );
    }
  }

  localStorage.setItem(QUEUE_KEY,JSON.stringify(remaining));
  logMessage(`[SYNC] Remaining=${remaining.length}`);
}

async function apiPost(payload,allowSessionRetry=true){
  if(API_URL.includes("BURAYA_")){
    throw new Error("API_URL henüz ayarlanmadı.");
  }

  const response=await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)
  });

  const text=await response.text();
  let result;

  try{
    result=JSON.parse(text);
  }catch(e){
    throw new Error(`HTTP ${response.status} - Sunucu JSON döndürmedi. Yanıt: ${text.slice(0,300)}`);
  }

  if(result.code==="SESSION_INVALID"){
    sessionToken=null;
    const err=new Error(result.message||tr("sessionExpired"));
    err.code="SESSION_INVALID";
    throw err;
  }

  if(result.status!=="success"){
    const err=new Error(result.message||"API error");
    err.code=result.code||"API_ERROR";
    throw err;
  }

  return result;
}

async function getPublicIP(){
  try{
    const r=await fetch("https://api.ipify.org?format=json",{cache:"no-store"});
    const j=await r.json();
    return j.ip||tr("unknown");
  }catch(e){
    return "IP Alınamadı";
  }
}

async function loadSiteCount(){
  if(!loggedInUser || loggedInUser.unvan.toLowerCase()!=="formen")return;
  const date=document.getElementById("reportDate").value;
  if(!date)return;

  try{
    const result=await apiPost({
      action:"get_site_count",
      session:sessionToken,
      date:date
    });

    document.getElementById("onSiteCount").textContent=result.count;
    document.getElementById("onSiteDate").textContent=
      `${tr("selected")} ${formatDateForDisplay(date)}`;
    document.getElementById("onSiteBox").style.display="block";
  }catch(e){
    logError("[SITE COUNT ERROR] "+e.message,"SITE_COUNT_ERROR","get_site_count","");
  }
}

function startSiteCountTimer(){
  stopSiteCountTimer();
  siteCountTimer=setInterval(()=>{
    const selected=document.getElementById("reportDate").value;
    const today=getTodayString();
    if(selected===today)loadSiteCount();
  },60000);
}

function stopSiteCountTimer(){
  if(siteCountTimer){clearInterval(siteCountTimer);siteCountTimer=null;}
}

async function loadReport(){
  if(!loggedInUser || loggedInUser.unvan.toLowerCase()!=="formen")return;

  const date=document.getElementById("reportDate").value;
  if(!date){alert(tr("invalidDate"));return;}

  try{
    const result=await apiPost({
      action:"get_report",
      session:sessionToken,
      date:date
    });

    currentReport=result;
    buildPrintArea(result);
    logMessage(`[RAPOR] ${result.rows.length} kayıt hazır.`);
  }catch(e){
    logError("[REPORT ERROR] "+e.message,"REPORT_ERROR","get_report","");
    alert(e.message);
  }
}

function translateAction(action){
  const a=String(action||"").trim();
  if(a==="GİRİŞ") return tr("actionEntry");
  if(a==="ÇIKIŞ") return tr("actionExit");
  if(a==="İZİNLİ") return tr("actionLeave");
  if(a==="RAPORLU") return tr("actionSick");
  return a;
}

function buildPrintArea(report){
  const area=document.getElementById("printArea");
  area.textContent="";

  const header=document.createElement("div");
  header.className="print-header";

  const h=document.createElement("h1");
  h.textContent=tr("printTitle");
  header.appendChild(h);

  const meta=document.createElement("div");
  meta.className="print-meta";
  meta.textContent=
    `${tr("selected")} ${formatDateForDisplay(report.date)} | ${tr("printTime")}: ${new Date().toLocaleString()}`;
  header.appendChild(meta);
  area.appendChild(header);

  const summary=document.createElement("div");
  summary.className="print-summary";
  summary.textContent=`${tr("site")}: ${report.count} ${tr("person")}`;
  area.appendChild(summary);

  const table=document.createElement("table");
  table.className="print-table";

  const thead=document.createElement("thead");
  const hr=document.createElement("tr");
  [tr("reportDateHeader"),tr("reportActionHeader"),tr("reportPersonHeader")].forEach(x=>{
    const th=document.createElement("th");
    th.textContent=x;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody=document.createElement("tbody");

  report.rows.forEach(row=>{
    const trEl=document.createElement("tr");

    if(row.status==="sahada")trEl.className="row-sahada";
    if(row.status==="cikis")trEl.className="row-cikis";
    if(row.status==="izinli")trEl.className="row-izinli";
    if(row.status==="raporlu")trEl.className="row-raporlu";

    [row.tarih_saat,translateAction(row.islem_tipi),row.personel].forEach(v=>{
      const td=document.createElement("td");
      td.textContent=v;
      trEl.appendChild(td);
    });

    tbody.appendChild(trEl);
  });

  table.appendChild(tbody);
  area.appendChild(table);

  const legend=document.createElement("div");
  legend.className="legend";

  const items=[
    ["legend-green",tr("legendGreen")],
    ["legend-yellow",tr("legendYellow")],
    ["legend-blue",tr("legendBlue")],
    ["legend-orange",tr("legendOrange")]
  ];

  items.forEach(([cls,text])=>{
    const span=document.createElement("span");
    span.className=cls;
    span.textContent=text;
    legend.appendChild(span);
  });

  area.appendChild(legend);

  if(!report.rows.length){
    const empty=document.createElement("p");
    empty.textContent=tr("noData");
    area.appendChild(empty);
  }
}

async function printReport(){
  if(!currentReport){
    await loadReport();
  }
  if(currentReport){
    buildPrintArea(currentReport);
    window.print();
  }
}

function formatDateForDisplay(dateString){
  const p=dateString.split("-");
  return `${p[2]}.${p[1]}.${p[0]}`;
}

function getTodayString(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function updateNetworkStatus(){
  if(navigator.onLine)setTimeout(runNfcWorkerV6,50);
  const el=document.getElementById("networkStatus");
  el.textContent=navigator.onLine?tr("online"):tr("offline");
  el.classList.toggle("offline",!navigator.onLine);
  if(navigator.onLine){
    syncOfflineQueue();
    flushErrorReportQueue();
  }
}

function updateStatus(text,bg,color){
  const box=document.getElementById("statusBox");
  box.textContent=text;
  box.style.backgroundColor=bg;
  box.style.color=color;
}

function logMessage(text){
  const box=document.getElementById("logBox");
  const line=document.createElement("div");
  line.textContent=`[${new Date().toLocaleTimeString("tr-TR")}] ${text}`;
  box.appendChild(line);
  box.scrollTop=box.scrollHeight;
}

function playBip(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    osc.connect(ctx.destination);
    osc.frequency.value=900;
    osc.start();
    setTimeout(()=>{osc.stop();ctx.close();},120);
  }catch(e){}
}
</script>
